<div ng-if="failure" class="alert alert-danger pageheadermsg" role="alert" id="sessionuserfailure">
    <span translate translate-values="{ message: failure.message }">LOGIN.ERROR</span><br/>
    <em ng-if="failure.status >= 500" translate>LOGIN.ERROR_HELP</em>
</div>
<div ng-if="turnstileerror" class="alert alert-danger pageheadermsg" role="alert">
    <strong translate="APP.ERROR"></strong>
    <span translate translate-values="{ code: turnstileerror }">LOGIN.TURNSTILE_ERROR</span>
    (<a href="" ng-click="vm.showTurnstileErrorHelp($event)" translate>LOGIN.TURNSTILE_ERROR_MORE</a>)
</div>

<div class="container welcome">
    <div class="row">
        <div class="col-md-6">
            <h1 class="motto" translate>WELCOME.TITLE</h1>

            <div class="getstartedaction">
                <button
                    ng-if="!isAuthenticated"
                    ng-hide="inMaintenanceMode"
                    ng-click="vm.getStarted()"
                    ng-disabled="busy"
                    class="btn btn-primary" translate>WELCOME.GET_STARTED</button>
                <button
                    ng-if="!isAuthenticated"
                    ui-sref="about"
                    class="btn btn-default" translate>WELCOME.LEARN_MORE</button>
                <button
                    ng-if="isAuthenticated && isTeacher"
                    ui-sref="teacher"
                    class="btn btn-primary" translate>WELCOME.ADMIN_LABEL</button>
                <button
                    ng-if="isAuthenticated"
                    ui-sref="projects"
                    class="btn btn-primary" translate>WELCOME.PROJECT_LABEL</button>
                <!-- without accounts, "Get started" begins a time-limited "Try it now" session -->
                <p class="text-muted sessionlimit"
                   ng-if="!accountsEnabled && !isAuthenticated && !inMaintenanceMode && vm.sessionLength"
                   translate="WELCOME.SESSION_LIMIT" translate-values="{ duration: vm.sessionLength }"></p>
                <!-- captcha for "Try it now" sessions when accounts are disabled -->
                <div id="welcome-turnstile-container"></div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="getstartedinfo">
                <div class="stepnumber">1</div>
                <h2 translate>WELCOME.STEP_1_TEXT</h2>
            </div>

            <div class="getstartedinfo">
                <div class="stepnumber">2</div>
                <h2 translate>WELCOME.STEP_2_TEXT</h2>
            </div>

            <div class="getstartedinfo">
                <div class="stepnumber">3</div>
                <h2 translate>WELCOME.STEP_3_TEXT</h2>
            </div>
        </div>
    </div>
</div>
